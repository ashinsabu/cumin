# Generate the Xcode project with: xcodegen generate   (brew install xcodegen)
name: Cumin
options:
  bundleIdPrefix: com.ashinsabu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  Cumin:
    type: application
    platform: iOS
    sources:
      - path: Cumin
        excludes:
          - "Config/*.xcconfig"
    configFiles:
      Debug: Cumin/Config/Debug.xcconfig
      Release: Cumin/Config/Release.xcconfig
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashinsabu.cumin
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Cumin/Info.plist
      properties:
        CFBundleDisplayName: Cumin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Read by GIDSignIn automatically.
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        # Read by AppConfig.
        CuminAPIBaseURL: $(API_BASE_URL)
        # Google Sign-In redirects back into the app via the reversed client ID scheme.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        # Allows http://localhost for the local Go server; production stays HTTPS-only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
