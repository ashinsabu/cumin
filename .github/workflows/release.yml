name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    name: Verify build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cumin
          POSTGRES_PASSWORD: cumin
          POSTGRES_DB: cumin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Build backend
        run: |
          cd server
          go build \
            -ldflags "-X github.com/ashinsabu/cumin/server/version.GitCommit=$(git rev-parse --short HEAD) \
                      -X github.com/ashinsabu/cumin/server/version.GitBranch=$(git rev-parse --abbrev-ref HEAD) \
                      -X github.com/ashinsabu/cumin/server/version.Version=${{ github.ref_name }}" \
            ./...

      - name: Vet backend
        run: cd server && go vet ./...

      - name: Unit tests (no DB)
        run: cd server && go test ./logger/... ./hub/... ./auth/...

      - name: Integration tests
        run: cd server && go test ./integration/... -v -timeout 60s
        env:
          TEST_DATABASE_URL: postgres://cumin:cumin@localhost:5432/cumin?sslmode=disable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend deps
        run: cd ui && npm ci

      - name: Frontend tests
        run: cd ui && npm test -- --run

      - name: Build frontend
        run: cd ui && npm run build

  deploy-backend:
    name: Deploy backend (Railway)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set version env vars on Railway service
        run: |
          railway variables set --service cumin \
            "VERSION=${{ github.ref_name }}" \
            "GIT_COMMIT=$(echo ${{ github.sha }} | cut -c1-7)" \
            "GIT_BRANCH=${{ github.ref_name }}" || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy
        run: railway up --service cumin --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy frontend (Firebase)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: cd ui && npm ci

      - name: Build
        run: cd ui && npm run build
        env:
          VITE_API_URL: https://api.cumin.ashinsabu.com
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

  github-release:
    name: Create GitHub release
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release with generated notes
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
