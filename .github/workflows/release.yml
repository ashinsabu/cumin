name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Build backend
        run: |
          cd server
          go build \
            -ldflags "-X github.com/ashinsabu/cumin/server/version.GitCommit=$(git rev-parse --short HEAD) \
                      -X github.com/ashinsabu/cumin/server/version.GitBranch=$(git rev-parse --abbrev-ref HEAD) \
                      -X github.com/ashinsabu/cumin/server/version.Version=${{ github.ref_name }}" \
            ./...

      - name: Vet backend
        run: cd server && go vet ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend deps
        run: cd ui && npm ci

      - name: Build frontend
        run: cd ui && npm run build

  deploy-backend:
    name: Deploy backend (Railway)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set version env vars on Railway service
      # railway up (CLI deploy) can't inject Dockerfile ARGs directly.
      # We set VERSION/GIT_COMMIT/GIT_BRANCH as Railway service variables so
      # version.Get() picks them up at runtime via os.Getenv fallback.
      run: |
        railway variables set --service cumin \
          "VERSION=${{ github.ref_name }}" \
          "GIT_COMMIT=$(echo ${{ github.sha }} | cut -c1-7)" \
          "GIT_BRANCH=main" || true
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: Deploy
      run: railway up --service cumin --detach
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy frontend (Firebase)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: cd ui && npm ci

      - name: Build
        run: cd ui && npm run build
        env:
          VITE_API_URL: https://api.cumin.ashinsabu.com
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
