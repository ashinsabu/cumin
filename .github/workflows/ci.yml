name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (build + vet + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cumin
          POSTGRES_PASSWORD: cumin
          POSTGRES_DB: cumin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Build
        run: cd server && go build ./...

      - name: Vet
        run: cd server && go vet ./...

      - name: Integration tests
        run: cd server && go test ./integration/... -count=1 -timeout 60s
        env:
          TEST_DATABASE_URL: postgres://cumin:cumin@localhost:5432/cumin?sslmode=disable

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: cd ui && npm ci

      - name: Build
        run: cd ui && npm run build

      - name: Unit tests
        run: cd ui && npm test
